<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">FoxChat launch moodboard</title>
  <desc id="desc">A colorful fictional product launch board with notes, shapes, and a chat preview.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f1ff"/>
      <stop offset="1" stop-color="#e9f9f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#33285c" flood-opacity=".15"/>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="48" fill="url(#canvas)"/>
  <circle cx="1080" cy="96" r="150" fill="#ffcf69" opacity=".65"/>
  <circle cx="115" cy="700" r="185" fill="#87dfc6" opacity=".55"/>
