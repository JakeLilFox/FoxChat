[package]
name = "tauri-plugin-remote-push"
version = "1.0.10"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-remote-push"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2.5.0"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.2.0", features = ["build"] }

[package.metadata.tauri-plugin]
android-src = "android"
